name: Gestion de muestras - CI

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-modulo:
    name: Validar modulo
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gestion-de-muestras/fabricssamples

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v6

      - name: Preparar PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Comprobar estructura esencial
        shell: bash
        run: |
          set -euo pipefail

          test -f fabricssamples.php
          test -f config.xml
          test -f composer.json
          test -f MANIFEST.sha256
          test -f CHANGELOG.md
          test -f README.md

          test -d config
          test -d controllers
          test -d mails
          test -d sql
          test -d src
          test -d translations
          test -d upgrade
          test -d views

          echo "Estructura esencial correcta."

      - name: Comprobar sintaxis PHP
        shell: bash
        run: |
          set -euo pipefail

          find . -type f -name '*.php' -print0 \
            | sort -z \
            | xargs -0 -n 1 php -l

          echo "Sintaxis PHP correcta."

      - name: Comprobar JavaScript
        shell: bash
        run: |
          set -euo pipefail

          FOUND=0

          while IFS= read -r -d '' file; do
            FOUND=1
            node --check "$file"
          done < <(find views -type f -name '*.js' -print0)

          if [ "$FOUND" -eq 0 ]; then
            echo "No hay archivos JavaScript que comprobar."
          else
            echo "JavaScript correcto."
          fi

      - name: Comprobar migraciones
        shell: bash
        run: |
          set -euo pipefail

          count=$(find upgrade -maxdepth 1 -type f -name 'upgrade-*.php' | wc -l | tr -d ' ')

          echo "Migraciones encontradas: $count"

          if [ "$count" -eq 0 ]; then
            echo "ERROR: No se encontraron migraciones."
            exit 1
          fi

          for file in upgrade/upgrade-*.php; do
            version=$(basename "$file" .php | sed 's/^upgrade-//')
            function_name="upgrade_module_${version//./_}"

            if ! grep -F "function ${function_name}" "$file" >/dev/null; then
              echo "ERROR: $file no contiene la funcion ${function_name}"
              exit 1
            fi
          done

          echo "Migraciones correctas."

      - name: Verificar integridad del manifiesto
        shell: bash
        run: |
          set -euo pipefail

          sha256sum -c MANIFEST.sha256

          echo "Manifiesto SHA256 correcto."

  compatibilidad-php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'

    defaults:
      run:
        working-directory: gestion-de-muestras/fabricssamples

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v6

      - name: Preparar PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Comprobar PHP ${{ matrix.php }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Version PHP:"
          php -v

          find . -type f -name '*.php' -print0 \
            | sort -z \
            | xargs -0 -n 1 php -l

          echo "Modulo correcto con PHP ${{ matrix.php }}"
