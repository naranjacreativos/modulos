name: Gestion de muestras - Compatibilidad PrestaShop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibilidad:
    name: PrestaShop 8.2 y 9.1
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v6

      - name: Probar PrestaShop 8.2
        id: ps82
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          MODULE_DIR="$GITHUB_WORKSPACE/gestion-de-muestras/fabricssamples"
          PS_NAME=ps82
          DB_NAME=db82
          NET=ps82-net
          PORT=8082
          IMAGE=prestashop/prestashop:8.2-apache

          cleanup() {
            docker rm -f "$PS_NAME" "$DB_NAME" >/dev/null 2>&1 || true
            docker network rm "$NET" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT
          cleanup

          test -f "$MODULE_DIR/fabricssamples.php"

          echo "Creando red..."
          docker network create "$NET" >/dev/null

          echo "Arrancando MySQL..."
          docker run -d \
            --name "$DB_NAME" \
            --network "$NET" \
            -e MYSQL_DATABASE=prestashop \
            -e MYSQL_USER=prestashop \
            -e MYSQL_PASSWORD=prestashop \
            -e MYSQL_ROOT_PASSWORD=root \
            mysql:8.0 >/dev/null

          echo "Esperando MySQL..."

          READY=0

          for i in $(seq 1 60); do
            if docker exec "$DB_NAME" \
              mysql -uprestashop -pprestashop prestashop \
              -e "SELECT 1;" >/dev/null 2>&1; then
              READY=1
              echo "MySQL listo."
              break
            fi

            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: MySQL no esta listo."
            docker logs "$DB_NAME"
            exit 1
          fi

          echo "Arrancando PrestaShop 8.2..."

          docker run -d \
            --name "$PS_NAME" \
            --network "$NET" \
            -p "$PORT:80" \
            -e PS_INSTALL_AUTO=1 \
            -e PS_DEV_MODE=1 \
            -e PS_DOMAIN="127.0.0.1:$PORT" \
            -e DB_SERVER="$DB_NAME" \
            -e DB_NAME=prestashop \
            -e DB_USER=prestashop \
            -e DB_PASSWD=prestashop \
            -e PS_LANGUAGE=es \
            -e PS_COUNTRY=ES \
            -e ADMIN_MAIL=admin@example.com \
            -e ADMIN_PASSWD='Test123456!' \
            "$IMAGE" >/dev/null

          echo "Esperando instalación de PrestaShop..."

          READY=0

          for i in $(seq 1 120); do
            if docker exec "$PS_NAME" \
              sh -lc 'cd /var/www/html && php bin/console prestashop:module list >/dev/null 2>&1'; then
              READY=1
              echo "PrestaShop 8.2 listo."
              break
            fi

            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: PrestaShop 8.2 no termino de instalarse."
            docker logs "$PS_NAME"
            exit 1
          fi

          echo "Copiando Gestión de muestras..."

          docker exec "$PS_NAME" \
            mkdir -p /var/www/html/modules/fabricssamples

          docker cp \
            "$MODULE_DIR/." \
            "$PS_NAME:/var/www/html/modules/fabricssamples/"

          docker exec "$PS_NAME" \
            chown -R www-data:www-data /var/www/html/modules/fabricssamples

          echo "Comprobando versión real de PrestaShop..."

          docker exec "$PS_NAME" sh -lc \
            "cd /var/www/html && php -r \"require 'config/config.inc.php'; echo _PS_VERSION_, PHP_EOL;\""

          echo "Instalando módulo..."

          docker exec "$PS_NAME" sh -lc \
            'cd /var/www/html && php bin/console prestashop:module install fabricssamples --no-interaction'

          echo "Desactivando módulo..."

          docker exec "$PS_NAME" sh -lc \
            'cd /var/www/html && php bin/console prestashop:module disable fabricssamples --no-interaction'

          echo "Activando módulo..."

          docker exec "$PS_NAME" sh -lc \
            'cd /var/www/html && php bin/console prestashop:module enable fabricssamples --no-interaction'

          echo "Reinicializando módulo..."

          docker exec "$PS_NAME" sh -lc \
            'cd /var/www/html && php bin/console prestashop:module reset fabricssamples --no-interaction'

          echo "Comprobando Front Office..."

          FRONT_OK=0

          sleep 3

          for i in $(seq 1 30); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 5 \
              --max-time 10 \
              "http://127.0.0.1:$PORT/" \
              >/dev/null 2>&1; then

              FRONT_OK=1
              echo "Front Office responde correctamente."
              break
            fi

            echo "Front Office aun no esta listo. Intento $i/30..."
            sleep 2
          done

          if [ "$FRONT_OK" -ne 1 ]; then
            echo "ERROR: El Front Office no responde correctamente."
            echo "Ultimas lineas del contenedor PrestaShop:"
            docker logs --tail 100 "$PS_NAME"
            exit 1
          fi

          echo "Desinstalando módulo..."

          docker exec "$PS_NAME" sh -lc \
            'cd /var/www/html && php bin/console prestashop:module uninstall fabricssamples --no-interaction'

          echo "Reinstalando módulo..."

          docker exec "$PS_NAME" sh -lc \
            'cd /var/www/html && php bin/console prestashop:module install fabricssamples --no-interaction'

          echo ""
          echo "OK - PrestaShop 8.2"
          echo "Instalacion correcta"
          echo "Desactivacion correcta"
          echo "Activacion correcta"
          echo "Reset correcto"
          echo "Front Office correcto"
          echo "Desinstalacion correcta"
          echo "Reinstalacion correcta"

      - name: Probar PrestaShop 9.1
        id: ps91
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          MODULE_DIR="$GITHUB_WORKSPACE/gestion-de-muestras/fabricssamples"
          PS_NAME=ps91
          DB_NAME=db91
          NET=ps91-net
