          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: PrestaShop 9.1 no termino de instalarse."
            docker logs "$PS_NAME"
            exit 1
          fi

          echo "Copiando Gestión de muestras..."

          docker exec "$PS_NAME" \
            mkdir -p /var/www/html/modules/fabricssamples

          docker cp \
