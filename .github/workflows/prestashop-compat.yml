              READY=1
              echo "MySQL listo."
              break
            fi

            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: MySQL no esta listo."
            docker logs "$DB_NAME"
            exit 1
          fi

          echo "Arrancando PrestaShop 9.1..."

          docker run -d \
            --name "$PS_NAME" \
            --network "$NET" \
            -p "$PORT:80" \
            -e PS_INSTALL_AUTO=1 \
            -e PS_DEV_MODE=1 \
            -e PS_DOMAIN="127.0.0.1:$PORT" \
            -e DB_SERVER="$DB_NAME" \
            -e DB_NAME=prestashop \
            -e DB_USER=prestashop \
            -e DB_PASSWD=prestashop \
            -e PS_LANGUAGE=es \
            -e PS_COUNTRY=ES \
            -e ADMIN_MAIL=admin@example.com \
            -e ADMIN_PASSWD='Test123456!' \
            "$IMAGE" >/dev/null

          echo "Esperando instalación de PrestaShop..."

          READY=0

          for i in $(seq 1 120); do
            if docker exec "$PS_NAME" \
